name: release-build

on:
  release:
    types:
      - created

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  ci:
    name: ci
    runs-on: windows-2022

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Run frontend checks
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm sizecheck

      - name: Run Rust checks
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build-windows:
    name: build-windows
    needs: ci
    runs-on: windows-2022

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Missing TAURI_UPDATER_PUBLIC_KEY secret for Windows updater builds."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY secret for Windows updater builds."
          }

      - name: Build Windows bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}"}}}' --ci

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG
          $version = $version -replace '^v', ''

          $assetDir = "release-assets"
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/skillport.exe"

          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $nsis = Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Recurse -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $nsis) {
            throw "Windows NSIS bundle not found."
          }

          $msi = Get-ChildItem -Path (Join-Path $bundleRoot "msi") -Recurse -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $msi) {
            throw "Windows MSI bundle not found."
          }

          if (-not (Test-Path $exePath)) {
            throw "Windows executable not found at $exePath."
          }

          $nsisAsset = Join-Path $assetDir ("skillport_" + $version + "_windows_x64_nsis.exe")
          Copy-Item -LiteralPath $nsis.FullName -Destination $nsisAsset -Force
          if (-not (Test-Path "$($nsis.FullName).sig")) {
            throw "Windows NSIS updater signature not found at $($nsis.FullName).sig."
          }
          Copy-Item -LiteralPath "$($nsis.FullName).sig" -Destination "$nsisAsset.sig" -Force
          Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $assetDir ("skillport_" + $version + "_windows_x64.msi")) -Force
          Compress-Archive -Path $exePath -DestinationPath (Join-Path $assetDir ("skillport_" + $version + "_windows_x64.zip")) -Force

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          node scripts/generate-latest-json.mjs --version $version --tag $env:RELEASE_TAG --asset-dir release-assets

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: build-macos
    needs: ci
    runs-on: macos-14

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Build macOS bundles
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --no-sign --ci

      - name: Prepare macOS assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets

          APP_PATH=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name "*.app" | head -1 || true)
          DMG_PATH=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name "*.dmg" | head -1 || true)

          [ -n "$APP_PATH" ] || { echo "macOS .app bundle not found" >&2; exit 1; }
          [ -n "$DMG_PATH" ] || { echo "macOS .dmg bundle not found" >&2; exit 1; }

          ditto -c -k --keepParent "$APP_PATH" "release-assets/skillport_${VERSION}_macos_universal.zip"
          cp "$DMG_PATH" "release-assets/skillport_${VERSION}_macos_universal.dmg"
          tar -C "$(dirname "$APP_PATH")" -czf "release-assets/skillport_${VERSION}_macos_universal.tar.gz" "$(basename "$APP_PATH")"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
