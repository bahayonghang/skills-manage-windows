name: Release Desktop

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Missing TAURI_UPDATER_PUBLIC_KEY secret for Windows updater builds."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY secret for Windows updater builds."
          }

      - name: Build Windows bundles
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $releaseConfig = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
              }
            }
          } | ConvertTo-Json -Depth 10 -Compress
          Set-Content -LiteralPath release-updater-config.json -Value $releaseConfig -NoNewline -Encoding utf8
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config release-updater-config.json --ci

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $nsis = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Recurse -Filter *.exe | Select-Object -First 1
          if ($null -eq $nsis) {
            throw "Windows NSIS bundle not found."
          }
          $nsisAsset = "release-assets/skillport_${version}_windows_x64_nsis.exe"
          Copy-Item $nsis.FullName $nsisAsset
          if (-not (Test-Path "$($nsis.FullName).sig")) {
            throw "Windows NSIS updater signature not found at $($nsis.FullName).sig."
          }
          Copy-Item "$($nsis.FullName).sig" "$nsisAsset.sig"

          $msi = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Recurse -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw "Windows MSI bundle not found."
          }
          Copy-Item $msi.FullName "release-assets/skillport_${version}_windows_x64.msi"

          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/skillport.exe"
          if (-not (Test-Path $exePath)) {
            throw "Windows executable not found at $exePath."
          }
          Compress-Archive -Path $exePath -DestinationPath "release-assets/skillport_${version}_windows_x64.zip" -Force

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          node scripts/prepare-release-body.mjs --version $version --output release-body.md
          node scripts/generate-latest-json.mjs --version $version --tag $env:GITHUB_REF_NAME --asset-dir release-assets

      - name: Release preflight
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          node scripts/release-preflight.mjs --version $version --tag $env:GITHUB_REF_NAME --config release-updater-config.json --asset-dir release-assets

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Build macOS bundles
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --no-sign --ci

      - name: Prepare macOS assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets

          APP_PATH=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name "*.app" | head -1 || true)
          DMG_PATH=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name "*.dmg" | head -1 || true)

          [ -n "$APP_PATH" ] || { echo "macOS .app bundle not found" >&2; exit 1; }
          [ -n "$DMG_PATH" ] || { echo "macOS .dmg bundle not found" >&2; exit 1; }

          ditto -c -k --keepParent "$APP_PATH" "release-assets/skillport_${VERSION}_macos_universal.zip"
          cp "$DMG_PATH" "release-assets/skillport_${VERSION}_macos_universal.dmg"
          tar -C "$(dirname "$APP_PATH")" -czf "release-assets/skillport_${VERSION}_macos_universal.tar.gz" "$(basename "$APP_PATH")"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.asset-arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset-arch: x86_64
            continue_on_error: false
          - runner: ubuntu-22.04-arm
            asset-arch: arm64
            continue_on_error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libfuse2 \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            rpm \
            wget
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs

      - name: Build Linux bundles
        run: pnpm tauri build --bundles deb,rpm,appimage --no-sign --ci

      - name: Prepare Linux assets
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset-arch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_ROOT="src-tauri/target/release/bundle"
          mkdir -p release-assets

          DEB_PATH=$(find "$BUNDLE_ROOT/deb" -maxdepth 1 -type f -name "*.deb" | head -1 || true)
          RPM_PATH=$(find "$BUNDLE_ROOT/rpm" -maxdepth 1 -type f -name "*.rpm" | head -1 || true)
          APPIMAGE_PATH=$(find "$BUNDLE_ROOT/appimage" -maxdepth 1 -type f -name "*.AppImage" | head -1 || true)

          [ -n "$DEB_PATH" ] || { echo "Linux .deb bundle not found" >&2; exit 1; }
          [ -n "$RPM_PATH" ] || { echo "Linux .rpm bundle not found" >&2; exit 1; }
          [ -n "$APPIMAGE_PATH" ] || { echo "Linux .AppImage bundle not found" >&2; exit 1; }

          cp "$DEB_PATH" "release-assets/skillport_${VERSION}_linux_${ASSET_ARCH}.deb"
          cp "$RPM_PATH" "release-assets/skillport_${VERSION}_linux_${ASSET_ARCH}.rpm"
          cp "$APPIMAGE_PATH" "release-assets/skillport_${VERSION}_linux_${ASSET_ARCH}.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-linux-${{ matrix.asset-arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Prepare release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/prepare-release-body.mjs --version "$VERSION" --output release-body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SkillPort v${{ steps.release_meta.outputs.version }}
          body_path: release-body.md
          files: release-assets/*
