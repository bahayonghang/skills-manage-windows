name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag (required for publish)
        required: false
        type: string
      mode:
        description: Rehearsal validates an exact main SHA without a GitHub Release; publish is tag-bound.
        required: false
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - publish
      rehearsal_ref:
        description: Exact 40-character commit SHA on origin/main (required for rehearsal only)
        required: false
        type: string
      run_updater_staging_smoke:
        description: Requires separately approved staging feed and rollback inputs; disabled by default.
        required: false
        default: false
        type: boolean
      updater_staging_feed:
        description: Approved HTTPS staging latest.json URL for a real previous-to-candidate update smoke.
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    name: Freeze release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      sha: ${{ steps.context.outputs.sha }}
      release_name: ${{ steps.context.outputs.release_name }}
      mode: ${{ steps.context.outputs.mode }}
    steps:
      - name: Require canonical manual workflow source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Manual releases must run from the main workflow definition." >&2; exit 1; }

      - name: Checkout context resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch canonical refs
        run: git fetch --force origin main:refs/remotes/origin/main --tags

      - name: Checkout frozen tag commit
        shell: bash
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REHEARSAL_REF: ${{ inputs.rehearsal_ref }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(node scripts/release-context.mjs --mode "$RELEASE_MODE" --tag "$RELEASE_TAG" --sha "$REHEARSAL_REF" --resolve-only)"
          git checkout --detach "$RELEASE_SHA"

      - name: Resolve and validate release context
        id: context
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REHEARSAL_REF: ${{ inputs.rehearsal_ref }}
        run: node scripts/release-context.mjs --mode "$RELEASE_MODE" --tag "$RELEASE_TAG" --sha "$REHEARSAL_REF"

  quality-gate:
    name: Validate frozen release commit
    needs: release-context
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.release-context.outputs.sha }}

  build-windows:
    name: Build Windows x64
    needs: [release-context, quality-gate]
    runs-on: windows-2022
    environment: desktop-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.0
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version metadata
        shell: pwsh
        run: node scripts/sync-version.mjs --check

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Missing TAURI_UPDATER_PUBLIC_KEY secret for Windows updater builds."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY secret for Windows updater builds."
          }

      - name: Build Windows bundles
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $releaseConfig = @{
            bundle = @{ createUpdaterArtifacts = $false }
            plugins = @{ updater = @{ pubkey = $env:TAURI_UPDATER_PUBLIC_KEY } }
          } | ConvertTo-Json -Depth 10 -Compress
          Set-Content -LiteralPath release-updater-config.json -Value $releaseConfig -NoNewline -Encoding utf8
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config release-updater-config.json --ci

      - name: Detect Azure Artifact Signing configuration
        id: azure-config
        shell: pwsh
        env:
          RELEASE_MODE: ${{ needs.release-context.outputs.mode }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_SUBSCRIPTION_ID", "AZURE_ARTIFACT_SIGNING_ENDPOINT", "AZURE_ARTIFACT_SIGNING_ACCOUNT", "AZURE_ARTIFACT_SIGNING_PROFILE")
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            if ($env:RELEASE_MODE -eq "publish") { throw "Azure Artifact Signing is required for publish; missing: $($missing -join ', ')." }
            "configured=false" >> $env:GITHUB_OUTPUT
            "authenticode=not-configured" >> $env:GITHUB_OUTPUT
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
            "authenticode=valid" >> $env:GITHUB_OUTPUT
          }

      - name: Azure login for Artifact Signing
        if: ${{ steps.azure-config.outputs.configured == 'true' }}
        uses: Azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing file catalog
        if: ${{ steps.azure-config.outputs.configured == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Recurse -Filter *.exe)
          $msi = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Recurse -Filter *.msi)
          $files = @("src-tauri/target/x86_64-pc-windows-msvc/release/skillport.exe") + $nsis.FullName + $msi.FullName
          if ($files.Count -ne 3) { throw "Artifact Signing requires exactly skillport.exe, one NSIS installer, and one MSI installer." }
          $files | ForEach-Object { Resolve-Path -LiteralPath $_ -Relative } | Set-Content -LiteralPath artifact-signing-files.txt -Encoding utf8

      - name: Sign Windows files with Azure Artifact Signing
        if: ${{ steps.azure-config.outputs.configured == 'true' }}
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\artifact-signing-files.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com/
          timestamp-digest: SHA256

      - name: Sign final NSIS updater bytes and record Windows signature state
        shell: pwsh
        env:
          RELEASE_MODE: ${{ needs.release-context.outputs.mode }}
          AUTHENTICODE_STATE: ${{ steps.azure-config.outputs.authenticode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Recurse -Filter *.exe)
          $msi = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Recurse -Filter *.msi)
          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/skillport.exe"
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1 -or -not (Test-Path $exePath)) { throw "Expected one NSIS, one MSI, and skillport.exe before signing." }
          pnpm tauri signer sign $nsis[0].FullName
          $files = @{ "skillport.exe" = $exePath; "nsis" = $nsis[0].FullName; "msi" = $msi[0].FullName }
          $results = @{}
          foreach ($name in $files.Keys) {
            $signature = Get-AuthenticodeSignature -LiteralPath $files[$name]
            $results[$name] = @{ status = $signature.Status.ToString(); signer = $signature.SignerCertificate.Subject; timestamp = $null -ne $signature.TimeStamperCertificate }
            if ($env:AUTHENTICODE_STATE -eq "valid" -and ($signature.Status.ToString() -ne "Valid" -or [string]::IsNullOrWhiteSpace($signature.SignerCertificate.Subject) -or $null -eq $signature.TimeStamperCertificate)) { throw "Authenticode verification failed for $name." }
            if ($env:AUTHENTICODE_STATE -eq "not-configured" -and $signature.Status.ToString() -ne "NotSigned") { throw "Unsigned rehearsal expected NotSigned for $name, got $($signature.Status)." }
          }
          @{ authenticode = $env:AUTHENTICODE_STATE; updaterSignature = "valid"; files = $results } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath windows-signing.json -Encoding utf8

      - name: Prepare Windows assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $nsis = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Recurse -Filter *.exe)
          if ($nsis.Count -ne 1) { throw "Expected exactly one Windows NSIS bundle, found $($nsis.Count)." }
          $nsisAsset = "release-assets/skillport_${env:RELEASE_VERSION}_windows_x64_nsis.exe"
          Copy-Item $nsis[0].FullName $nsisAsset
          if (-not (Test-Path "$($nsis[0].FullName).sig")) { throw "Windows NSIS updater signature not found after signing the final Authenticode bytes." }
          Copy-Item "$($nsis[0].FullName).sig" "$nsisAsset.sig"

          $msi = @(Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Recurse -Filter *.msi)
          if ($msi.Count -ne 1) { throw "Expected exactly one Windows MSI bundle, found $($msi.Count)." }
          Copy-Item $msi[0].FullName "release-assets/skillport_${env:RELEASE_VERSION}_windows_x64.msi"

          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/skillport.exe"
          if (-not (Test-Path $exePath)) { throw "Windows executable not found at $exePath." }
          Compress-Archive -Path $exePath -DestinationPath "release-assets/skillport_${env:RELEASE_VERSION}_windows_x64.zip" -Force
          node scripts/generate-latest-json.mjs --version $env:RELEASE_VERSION --tag $env:RELEASE_TAG --asset-dir release-assets

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-windows
          path: release-assets/*
          if-no-files-found: error

      - name: Upload Windows signing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signing-evidence
          path: |
            windows-signing.json
            release-updater-config.json
          if-no-files-found: error

  windows-install-smoke:
    name: Smoke Windows install, launch, and uninstall
    needs: [release-context, build-windows]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2022
    steps:
      - name: Checkout frozen release verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - name: Download Windows release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-release-windows
          path: smoke-assets
      - name: Download Windows signing evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signing-evidence
          path: smoke-evidence
      - name: Verify signatures before installation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_MODE: ${{ needs.release-context.outputs.mode }}
        run: |
          node scripts/release-preflight.mjs --version $env:RELEASE_VERSION --tag $env:RELEASE_TAG --mode $env:RELEASE_MODE --asset-dir smoke-assets --config smoke-evidence/release-updater-config.json --signing-state smoke-evidence/windows-signing.json
      - name: Install launch and uninstall final NSIS
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -LiteralPath smoke-assets -Filter "*windows_x64_nsis.exe" | Select-Object -Single
          if ($null -eq $installer) { throw "Final NSIS asset was not downloaded." }
          $installRoot = Join-Path $env:RUNNER_TEMP "skillport-install-smoke-$env:RELEASE_VERSION"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -Wait
          $executable = Get-ChildItem -LiteralPath $installRoot -Recurse -Filter skillport.exe | Select-Object -First 1
          if ($null -eq $executable) { throw "Installed SkillPort executable was not found." }
          $process = Start-Process -FilePath $executable.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed SkillPort exited before the smoke check." }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Recurse -Filter uninstall.exe | Select-Object -First 1
          if ($null -eq $uninstaller) { throw "NSIS uninstaller was not found." }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          if (Test-Path $executable.FullName) { throw "Uninstall left the application executable behind." }

  build-macos:
    name: Build macOS universal
    needs: [release-context, quality-gate]
    runs-on: macos-14
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.12.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.0
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync version metadata
        run: node scripts/sync-version.mjs --check
      - name: Build universal CLI
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin skillport-cli --locked --target aarch64-apple-darwin
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin skillport-cli --locked --target x86_64-apple-darwin
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create src-tauri/target/aarch64-apple-darwin/release/skillport-cli src-tauri/target/x86_64-apple-darwin/release/skillport-cli -output src-tauri/target/universal-apple-darwin/release/skillport-cli
      - name: Build macOS bundles
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --no-sign --ci
      - name: Prepare macOS assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets
          mapfile -d '' APPS < <(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name "*.app" -print0)
          mapfile -d '' DMGS < <(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name "*.dmg" -print0)
          [ "${#APPS[@]}" -eq 1 ] || { echo "Expected exactly one macOS app bundle" >&2; exit 1; }
          [ "${#DMGS[@]}" -eq 1 ] || { echo "Expected exactly one macOS DMG bundle" >&2; exit 1; }
          ditto -c -k --keepParent "${APPS[0]}" "release-assets/skillport_${RELEASE_VERSION}_macos_universal.zip"
          cp "${DMGS[0]}" "release-assets/skillport_${RELEASE_VERSION}_macos_universal.dmg"
          tar -C "$(dirname "${APPS[0]}")" -czf "release-assets/skillport_${RELEASE_VERSION}_macos_universal.tar.gz" "$(basename "${APPS[0]}")"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-macos
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.asset-arch }}
    needs: [release-context, quality-gate]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset-arch: x86_64
            continue_on_error: false
          - runner: ubuntu-22.04-arm
            asset-arch: arm64
            continue_on_error: true
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.12.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.0
        with:
          toolchain: "1.97.0"
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl file libfuse2 libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config rpm wget
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev || sudo apt-get install -y --no-install-recommends libsoup2.4-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync version metadata
        run: node scripts/sync-version.mjs --check
      - name: Build Linux bundles
        run: pnpm tauri build --bundles deb,rpm,appimage --no-sign --ci
      - name: Prepare Linux assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          ASSET_ARCH: ${{ matrix.asset-arch }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/release/bundle"
          mkdir -p release-assets
          mapfile -d '' DEBS < <(find "$BUNDLE_ROOT/deb" -maxdepth 1 -type f -name "*.deb" -print0)
          mapfile -d '' RPMS < <(find "$BUNDLE_ROOT/rpm" -maxdepth 1 -type f -name "*.rpm" -print0)
          mapfile -d '' APPIMAGES < <(find "$BUNDLE_ROOT/appimage" -maxdepth 1 -type f -name "*.AppImage" -print0)
          [ "${#DEBS[@]}" -eq 1 ] && [ "${#RPMS[@]}" -eq 1 ] && [ "${#APPIMAGES[@]}" -eq 1 ] || { echo "Expected exactly one DEB, RPM and AppImage" >&2; exit 1; }
          cp "${DEBS[0]}" "release-assets/skillport_${RELEASE_VERSION}_linux_${ASSET_ARCH}.deb"
          cp "${RPMS[0]}" "release-assets/skillport_${RELEASE_VERSION}_linux_${ASSET_ARCH}.rpm"
          cp "${APPIMAGES[0]}" "release-assets/skillport_${RELEASE_VERSION}_linux_${ASSET_ARCH}.AppImage"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-linux-${{ matrix.asset-arch }}
          path: release-assets/*
          if-no-files-found: error

  aggregate:
    name: Verify release artifacts
    needs: [release-context, quality-gate, build-windows, build-macos, build-linux, windows-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.12.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.0
        with:
          toolchain: "1.97.0"
      - name: Install verifier system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev || sudo apt-get install -y --no-install-recommends libsoup2.4-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true
      - name: Download Windows signing evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signing-evidence
          path: signing-evidence
      - name: Verify signature metadata inventory and checksums
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_MODE: ${{ needs.release-context.outputs.mode }}
        run: |
          node scripts/release-preflight.mjs --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --mode "$RELEASE_MODE" --config signing-evidence/release-updater-config.json --signing-state signing-evidence/windows-signing.json --asset-dir release-assets
          node scripts/release-artifacts.mjs --version "$RELEASE_VERSION" --asset-dir release-assets
          node scripts/release-artifacts.mjs --version "$RELEASE_VERSION" --asset-dir release-assets --verify
      - name: Record validated release evidence
        env:
          RELEASE_MODE: ${{ needs.release-context.outputs.mode }}
          RELEASE_SHA: ${{ needs.release-context.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          mkdir -p release-validation
          node -e 'const fs=require("fs"); const signing=JSON.parse(fs.readFileSync("signing-evidence/windows-signing.json")); fs.writeFileSync("release-validation/release-validation.json", JSON.stringify({mode:process.env.RELEASE_MODE,sha:process.env.RELEASE_SHA,tag:process.env.RELEASE_TAG,version:process.env.RELEASE_VERSION,authenticode:signing.authenticode,updaterSignature:signing.updaterSignature,assets:fs.readdirSync("release-assets").sort()},null,2)+"\n")'
      - name: Upload validated release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-desktop-release
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload release validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-validation
          path: release-validation/release-validation.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish verified draft
    needs: [release-context, aggregate]
    if: ${{ needs.release-context.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_SHA: ${{ needs.release-context.outputs.sha }}
      RELEASE_NAME: ${{ needs.release-context.outputs.release_name }}
    steps:
      - name: Checkout frozen release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - name: Download validated release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-desktop-release
          path: release-assets
      - name: Generate build provenance predicate
        id: provenance-predicate
        uses: actions/attest-build-provenance/predicate@1176ef556905f349f669722abf30bce1a6e16e01 # predicate@1.1.5
      - name: Attest final Windows release bytes
        uses: actions/attest@11bbd243972067817e9ed160cb123cab3601f436 # v2
        with:
          subject-path: |
            release-assets/*windows_x64_nsis.exe
            release-assets/*windows_x64.msi
            release-assets/*windows_x64.zip
          predicate-type: ${{ steps.provenance-predicate.outputs.predicate-type }}
          predicate: ${{ steps.provenance-predicate.outputs.predicate }}
      - name: Prepare release notes
        run: node scripts/prepare-release-body.mjs --version "$RELEASE_VERSION" --output release-body.md
      - name: Verify remote tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [ "$TAG_SHA" = "$RELEASE_SHA" ] || { echo "Remote tag target changed after context freeze." >&2; exit 1; }
      - name: Create or reuse same-tag draft
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json 2> release-error.txt; then
            jq -e '.draft == true' release.json >/dev/null || { echo "A public release already exists for ${RELEASE_TAG}." >&2; exit 1; }
          else
            grep -q "HTTP 404" release-error.txt || { cat release-error.txt >&2; exit 1; }
            jq -n --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg name "$RELEASE_NAME" --rawfile body release-body.md \
              '{tag_name:$tag,target_commitish:$sha,name:$name,body:$body,draft:true,prerelease:false}' > draft-request.json
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input draft-request.json > release.json
          fi
          jq -r '.id' release.json | sed 's/^/release_id=/' >> "$GITHUB_OUTPUT"
      - name: Reset draft assets
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.assets[].id' release.json | while read -r asset_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
      - name: Upload validated assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify draft API state and inventory
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          node scripts/release-draft-state.mjs --release-json release.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION"
      - name: Fresh-download and verify checksums and provenance
        run: |
          mkdir fresh-release
          gh release download "$RELEASE_TAG" --dir fresh-release
          node scripts/release-artifacts.mjs --version "$RELEASE_VERSION" --asset-dir fresh-release --verify
          gh attestation verify "fresh-release/skillport_${RELEASE_VERSION}_windows_x64_nsis.exe" -R bahayonghang/skills-manage-windows
          gh attestation verify "fresh-release/skillport_${RELEASE_VERSION}_windows_x64.msi" -R bahayonghang/skills-manage-windows
          gh attestation verify "fresh-release/skillport_${RELEASE_VERSION}_windows_x64.zip" -R bahayonghang/skills-manage-windows
      - name: Publish verified draft
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [ "$TAG_SHA" = "$RELEASE_SHA" ] || { echo "Remote tag target changed before publish." >&2; exit 1; }
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.release_id }}" -F draft=false > published.json
      - name: Verify public release state
        run: node scripts/release-draft-state.mjs --release-json published.json --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --public

  updater-staging-smoke:
    name: Deferred updater staging smoke
    needs: [release-context, aggregate]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.release-context.outputs.mode == 'rehearsal' && inputs.run_updater_staging_smoke && inputs.updater_staging_feed != '' }}
    runs-on: windows-2022
    environment: updater-staging
    steps:
      - name: Require an approved HTTPS staging feed
        shell: pwsh
        env:
          STAGING_FEED: ${{ inputs.updater_staging_feed }}
        run: |
          $uri = [Uri]$env:STAGING_FEED
          if ($uri.Scheme -ne "https" -or $uri.Host -eq "github.com") { throw "Updater staging smoke requires an approved non-public HTTPS staging feed." }
          throw "Follow docs/reference/updater-staging-runbook.md to supply the separately approved previous installer, candidate feed, rollback target, and environment credentials."
