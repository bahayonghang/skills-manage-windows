packages:
  - '.'

# Run and exec use installed dependencies; only an explicit install changes them.
verifyDepsBeforeRun: false

allowBuilds:
  esbuild: true
  better-sqlite3: true
  "@tailwindcss/oxide": true
  msw: false

minimumReleaseAgeExclude:
  - shadcn@4.15.0

overrides:
  "@vue/server-renderer": 3.5.42
  "@vue/shared": 3.5.42
  source-map-js: 1.2.2
  "vitepress>vite": 6.4.3
  vue: 3.5.42
